openapi: 3.0.3
info:
  title: Event Ticketing API
  description: Спецификация REST API из ЛР2, дополненная health-check из ЛР3. В ЛР3 реализован только health-check; остальные операции описывают планируемый API.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Локальный сервер разработки

tags:
  - name: Health
    description: Проверка работоспособности сервиса
  - name: Auth
    description: Регистрация и вход
  - name: Venues
    description: Площадки и места
  - name: Events
    description: Мероприятия
  - name: Tickets
    description: Билеты

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Проверка работоспособности сервиса
      tags: [Health]
      security: []
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      summary: Регистрация пользователя
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      summary: Вход в систему и получение токена
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /venues:
    get:
      summary: Список площадок
      tags: [Venues]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Создание площадки (только организатор)
      tags: [Venues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVenueRequest'
      responses:
        '201':
          description: Площадка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /venues/{venueId}/seats:
    post:
      summary: Добавление мест на площадку (только организатор)
      tags: [Venues]
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatsRequest'
      responses:
        '201':
          description: Места созданы
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /events:
    get:
      summary: Афиша — список мероприятий
      tags: [Events]
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу мероприятия
          required: false
          schema:
            $ref: '#/components/schemas/EventStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Создание мероприятия (только организатор)
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Мероприятие создано (статус draft)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}:
    get:
      summary: Получение мероприятия по ID
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Частичное обновление мероприятия, в том числе смена статуса (только организатор)
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Мероприятие обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Удаление мероприятия без проданных билетов (только организатор)
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Мероприятие удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /events/{eventId}/seats:
    get:
      summary: Места мероприятия со статусом занятости
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSeatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/tickets:
    get:
      summary: Проданные билеты по мероприятию (только организатор)
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets:
    get:
      summary: Список билетов текущего пользователя
      tags: [Tickets]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Покупка билета на свободное место
      tags: [Tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Билет куплен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tickets/{ticketId}:
    delete:
      summary: Отмена билета (владелец или организатор), место освобождается
      tags: [Tickets]
      parameters:
        - name: ticketId
          in: path
          required: true
          description: UUID билета
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Билет отменён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      description: Максимальное число записей в ответе
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    VenueId:
      name: venueId
      in: path
      required: true
      description: UUID площадки
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: UUID мероприятия
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Токен отсутствует или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав для этого действия
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния ресурса (например, место уже занято)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, app, version, environment, uptime]
      properties:
        status:
          type: string
          enum: [pass]
        app:
          type: string
          example: Event Ticketing API
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          example: development
        uptime:
          type: number
          minimum: 0
          description: Время работы приложения в секундах
          example: 12.345

    EventStatus:
      type: string
      enum: [draft, published, cancelled, finished]
      example: published

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          example: ivan@example.com
        password:
          type: string
          minLength: 8
          example: "StrongPass123"
        full_name:
          type: string
          maxLength: 100
          example: "Иван Петров"
        role:
          type: string
          enum: [user, organizer]
          default: user

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ivan@example.com
        password:
          type: string
          example: "StrongPass123"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: bearer

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, organizer]
        created_at:
          type: string
          format: date-time

    CreateVenueRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          maxLength: 150
          example: "Большой зал филармонии"
        address:
          type: string
          maxLength: 255
          example: "г. Симферополь, ул. Пушкина, 1"

    VenueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        created_at:
          type: string
          format: date-time

    CreateSeatsRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [row_label, seats_count]
            properties:
              row_label:
                type: string
                maxLength: 10
                example: "A"
              seats_count:
                type: integer
                minimum: 1
                example: 20

    SeatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        row_label:
          type: string
          example: "A"
        seat_number:
          type: integer
          example: 5

    EventSeatResponse:
      type: object
      properties:
        seat_id:
          type: string
          format: uuid
        row_label:
          type: string
          example: "A"
        seat_number:
          type: integer
          example: 5
        is_available:
          type: boolean
          example: true

    CreateEventRequest:
      type: object
      required: [venue_id, title, starts_at, price]
      properties:
        venue_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          example: "Концерт симфонического оркестра"
        description:
          type: string
          example: "Вечер классической музыки"
        starts_at:
          type: string
          format: date-time
          example: "2026-12-20T19:00:00Z"
        price:
          type: number
          minimum: 0
          example: 1500.00

    UpdateEventRequest:
      type: object
      description: Все поля необязательны, передаются только изменяемые
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        price:
          type: number
          minimum: 0
        status:
          $ref: '#/components/schemas/EventStatus'

    EventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        price:
          type: number
          example: 1500.00
        status:
          $ref: '#/components/schemas/EventStatus'
        created_at:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [event_id, seat_id]
      properties:
        event_id:
          type: string
          format: uuid
        seat_id:
          type: string
          format: uuid

    TicketResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        seat_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        price_paid:
          type: number
          example: 1500.00
        status:
          type: string
          enum: [reserved, paid, cancelled]
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "SEAT_ALREADY_TAKEN"
        message:
          type: string
          example: "Место уже занято на это мероприятие"
        timestamp:
          type: string
          format: date-time
