<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="540" viewBox="0 0 1220 540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#707070"/>
    </marker>
  </defs>

  <rect width="1220" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#222222">Event Ticketing API — диаграмма контейнеров (C4, уровень 2)</text>

  <!-- System boundary -->
  <rect x="260" y="50" width="940" height="455" rx="6" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="275" y="483" font-size="13" font-weight="bold" fill="#555555">Event Ticketing</text>
  <text x="275" y="497" font-size="10" fill="#555555">[Software System]</text>

  <!-- Person: Зритель -->
  <circle cx="85" cy="82" r="26" fill="#08427B"/>
  <rect x="20" y="100" width="130" height="100" rx="14" fill="#08427B"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="85" y="128" font-size="14" font-weight="bold">Зритель</text>
    <text x="85" y="143" font-size="10">[Person]</text>
    <text x="85" y="163" font-size="11">Смотрит афишу,</text>
    <text x="85" y="177" font-size="11">покупает билеты</text>
  </g>

  <!-- Person: Организатор -->
  <circle cx="85" cy="352" r="26" fill="#08427B"/>
  <rect x="20" y="370" width="130" height="100" rx="14" fill="#08427B"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="85" y="398" font-size="14" font-weight="bold">Организатор</text>
    <text x="85" y="413" font-size="10">[Person]</text>
    <text x="85" y="433" font-size="11">Управляет</text>
    <text x="85" y="447" font-size="11">мероприятиями</text>
  </g>

  <!-- Container: Web-приложение -->
  <rect x="300" y="100" width="210" height="100" rx="8" fill="#438DD5"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="405" y="130" font-size="15" font-weight="bold">Web-приложение</text>
    <text x="405" y="147" font-size="10">[Container: Web Application]</text>
    <text x="405" y="168" font-size="12">Интерфейс для</text>
    <text x="405" y="183" font-size="12">зрителей</text>
  </g>

  <!-- Container: Web App Organizer -->
  <rect x="300" y="370" width="210" height="100" rx="8" fill="#438DD5"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="405" y="400" font-size="15" font-weight="bold">Web App Organizer</text>
    <text x="405" y="417" font-size="10">[Container: Web Application]</text>
    <text x="405" y="438" font-size="12">Интерфейс для</text>
    <text x="405" y="453" font-size="12">организаторов</text>
  </g>

  <!-- Container: Backend API -->
  <rect x="650" y="215" width="220" height="110" rx="8" fill="#438DD5"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="760" y="245" font-size="15" font-weight="bold">Backend API</text>
    <text x="760" y="262" font-size="10">[Container: Python, FastAPI]</text>
    <text x="760" y="283" font-size="11">REST API, JWT, бизнес-логика</text>
    <text x="760" y="298" font-size="11">продажи билетов</text>
  </g>

  <!-- Container: Database (cylinder) -->
  <path d="M990,219 L990,321 A95,14 0 0 0 1180,321 L1180,219 Z" fill="#438DD5"/>
  <ellipse cx="1085" cy="219" rx="95" ry="14" fill="#5a9fe0"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="1085" y="250" font-size="15" font-weight="bold">База данных</text>
    <text x="1085" y="267" font-size="10">[Container: PostgreSQL 16]</text>
    <text x="1085" y="287" font-size="11">Пользователи, площадки,</text>
    <text x="1085" y="301" font-size="11">места, мероприятия,</text>
    <text x="1085" y="315" font-size="11">билеты</text>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke="#707070" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)">
    <!-- Зритель -> Web -->
    <path d="M150,150 H300"/>
    <!-- Организатор -> Web App Organizer -->
    <path d="M150,420 H300"/>
    <!-- Web -> Backend -->
    <path d="M510,150 H610 V245 H650"/>
    <!-- Web App Organizer -> Backend -->
    <path d="M510,420 H610 V295 H650"/>
    <!-- Backend -> DB -->
    <path d="M870,270 H990"/>
  </g>

  <!-- Connector labels -->
  <g fill="#444444" font-size="11" text-anchor="middle">
    <text x="205" y="143">Использует</text>
    <text x="205" y="413">Использует</text>

    <text x="560" y="130">API</text>
    <text x="560" y="143" font-size="10">[HTTPS, JSON]</text>

    <text x="560" y="400">API</text>
    <text x="560" y="413" font-size="10">[HTTPS, JSON]</text>

    <text x="930" y="248">Читает / пишет</text>
    <text x="930" y="261" font-size="10">[SQL]</text>
  </g>
</svg>
